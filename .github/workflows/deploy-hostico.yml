name: Build & Deploy Qualiadept Stream (Web + Android APK Releases)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostico (stream.qualiadept.eu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
          VITE_APP_VERSION_CODE: "${{ github.run_number }}"
        run: npm run build

      - name: Deploy dist/ to Hostico via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          port: 21
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

  build-android-apk:
    name: Build Qualiadept Stream Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Capacitor
        env:
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
          VITE_APP_VERSION_CODE: "${{ github.run_number }}"
        run: npm run build

      - name: Add & Sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Q-Play Android launcher icons & dark splash screen
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet pillow
          python3 scripts/apply-android-icons.py --android

      - name: Configure persistent Android signing key & versionCode
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import base64, os, re, sys

          ks_b64 = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "").strip()
          if not ks_b64:
              sys.exit("ERROR: ANDROID_DEBUG_KEYSTORE_BASE64 secret is missing!")

          ks_path = "android/app/qualiadept.jks"
          with open(ks_path, "wb") as f:
              f.write(base64.b64decode(ks_b64))

          run_num = os.environ["RUN_NUMBER"]
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', text, count=1)

          signing_block = """    signingConfigs {
                  debug {
                      storeFile file('qualiadept.jks')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }"""

          assert "    buildTypes {" in text, "Expected buildTypes block in android/app/build.gradle"
          text = text.replace("    buildTypes {", signing_block, 1)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"Configured qualiadept.jks signingConfig and version 1.0.{run_num}")
          PY

      - name: Build Android APK (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK uses persistent Qualiadept certificate
        run: |
          python3 - <<'PY'
          import hashlib, struct, sys

          apk_path = "android/app/build/outputs/apk/debug/app-debug.apk"
          with open(apk_path, "rb") as f:
              data = f.read()
          idx = data.rfind(b"APK Sig Block 42")
          if idx < 0:
              sys.exit("ERROR: Missing APK Signature Scheme v2 block!")
          block_size = struct.unpack("<Q", data[idx - 8 : idx])[0]
          block = data[idx + 16 - block_size : idx - 8]
          if b"Qualiadept" not in block:
              sys.exit("ERROR: APK was NOT signed with the persistent Qualiadept keystore!")
          pos = 0
          while True:
              i = block.find(b"\x30\x82", pos)
              if i < 0:
                  break
              length = struct.unpack(">H", block[i + 2 : i + 4])[0] + 4
              der = block[i : i + length]
              if b"Qualiadept" in der:
                  print("Verified Qualiadept signing cert SHA-256:", hashlib.sha256(der).hexdigest())
                  sys.exit(0)
              pos = i + 2
          sys.exit("ERROR: Could not parse Qualiadept certificate DER!")
          PY

      - name: Prepare versioned APK & Samsung Tizen TV package
        env:
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/Qualiadept-Stream-v1.0.${{ github.run_number }}.apk"
          node scripts/build-tizen.mjs
          (cd tizen-dist && zip -qr "../release-assets/Qualiadept-Stream-Samsung-TV-Tizen-v1.0.${{ github.run_number }}.zip" .)

      - name: Upload APK & Tizen TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Qualiadept-Stream-Releases
          path: release-assets/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Qualiadept Stream v1.0.${{ github.run_number }} (Android + Samsung TV)"
          body: |
            Versiune nouă pentru **Qualiadept Stream** (1-la-1 cu `https://stream.qualiadept.eu`).
            - **Android:** descarcă `.apk` și apasă **Update** direct pe telefon.
            - **Samsung Smart TV (Tizen / QLED 43Q60D):** descarcă pachetul `.zip` pentru Tizen Studio (vezi `tizen/INSTALL_SAMSUNG_43Q60D.md`).
          files: |
            release-assets/Qualiadept-Stream-v1.0.${{ github.run_number }}.apk
            release-assets/Qualiadept-Stream-Samsung-TV-Tizen-v1.0.${{ github.run_number }}.zip
          draft: false
          prerelease: false
