name: Build Android APK (Capacitor)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Qualiadept Stream Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Initialize & Sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk qualiadept-stream.apk

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qualiadept-stream-android-apk
          path: qualiadept-stream.apk
          retention-days: 30
