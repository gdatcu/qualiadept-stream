services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - /opt/streaming/jellyfin/config:/config
      - /opt/streaming/jellyfin/cache:/cache
      - type: bind
        source: /mnt/gdrive
        target: /media
        read_only: true
        bind:
          propagation: rslave
    # Keep live HLS transcode segments in 6 GB of RAM (out of 24 GB VM RAM):
    # faster startup, zero SSD wear, and transcoding can NEVER fill up the OS disk or lock jellyfin.db.
    tmpfs:
      - /cache/transcodes:size=6G,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/streaming/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/streaming/caddy/data:/data
      - /opt/streaming/caddy/config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - jellyfin
